kind: source
name: arangodb-source
type: arangodb
host: ${ARANGODB_HOST:127.0.0.1}
port: ${ARANGODB_PORT:8529}
database: ${ARANGODB_DATABASE}
user: ${ARANGODB_USER}
password: ${ARANGODB_PASSWORD}
---
kind: tool
name: execute_aql
type: arangodb-execute-aql
source: arangodb-source
description: Use this tool to execute a dynamic AQL query against ArangoDB.
---
kind: toolset
name: arangodb_database_tools
tools:
- execute_aql
